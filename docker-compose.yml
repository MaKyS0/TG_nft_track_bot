services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override .env values so the bot talks to the containers below.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gifts}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gifts}
      REDIS_URL: redis://redis:6379/0
      # The app always listens on 8080 inside the container; WEB_PORT in .env only picks the host-side port.
      WEB_PORT: "8080"
      WEB_HOST: 0.0.0.0  # inside the container; the host side is published to 127.0.0.1 only (see ports)
    ports:
      # Mini App web server. Bound to localhost: expose it via the caddy service (HTTPS) or a tunnel.
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional HTTPS front for the Mini App: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gifts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gifts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gifts} -d ${POSTGRES_DB:-gifts}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
