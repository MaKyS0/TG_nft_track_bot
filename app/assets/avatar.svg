<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#4a5bf0"/>
      <stop offset="0.55" stop-color="#2a2f9e"/>
      <stop offset="1" stop-color="#0c1033"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="50%">
      <stop offset="0" stop-color="#7fe7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fe7ff" stop-opacity="0"/>
    </radialGradient>
    <!-- the repeating "pattern" layer every Telegram NFT has: small diamonds in a staggered grid -->
    <pattern id="pat" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <path d="M16 6 L22 16 L16 26 L10 16Z" fill="#ffffff" fill-opacity="0.08"/>
      <path d="M48 38 L54 48 L48 58 L42 48Z" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="48" cy="10" r="2.4" fill="#ffffff" fill-opacity="0.07"/>
      <circle cx="16" cy="44" r="2.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34e0c8"/>
      <stop offset="1" stop-color="#1397b9"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1397b9"/>
      <stop offset="1" stop-color="#0c6f96"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5df0dc"/>
      <stop offset="1" stop-color="#2bc6c4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.55" stop-color="#ffb81f"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#050824" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#pat)"/>
  <circle cx="320" cy="330" r="300" fill="url(#glow)"/>

  <!-- tracking rings, one of them lit like a radar sweep -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3">
    <circle cx="320" cy="330" r="150"/>
    <circle cx="320" cy="330" r="215"/>
    <circle cx="320" cy="330" r="280"/>
  </g>
  <path d="M320 115 A215 215 0 0 1 535 330" fill="none" stroke="#7fe7ff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M320 50 A280 280 0 0 1 600 330" fill="none" stroke="#7fe7ff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.35"/>
  <!-- the "found it" ping -->
  <circle cx="500" cy="196" r="30" fill="#ff5f7a" fill-opacity="0.22"/>
  <circle cx="500" cy="196" r="15" fill="#ff5f7a"/>
  <circle cx="500" cy="196" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>

  <!-- the gift -->
  <g filter="url(#shadow)">
    <rect x="212" y="340" width="216" height="150" rx="16" fill="url(#front)"/>
    <path d="M388 340 H412 a16 16 0 0 1 16 16 V474 a16 16 0 0 1 -16 16 H388Z" fill="url(#side)" opacity="0.55"/>
    <rect x="196" y="288" width="248" height="62" rx="16" fill="url(#lid)"/>
    <rect x="196" y="334" width="248" height="16" fill="#0a6e8a" fill-opacity="0.28"/>
    <rect x="296" y="288" width="48" height="202" fill="url(#gold)"/>
    <rect x="296" y="288" width="12" height="202" fill="#ffffff" fill-opacity="0.28"/>
    <!-- bow -->
    <path d="M320 292 C262 214 196 232 218 276 C234 304 286 300 320 292Z" fill="url(#gold)"/>
    <path d="M320 292 C378 214 444 232 422 276 C406 304 354 300 320 292Z" fill="url(#gold)"/>
    <path d="M320 292 C268 238 226 246 236 270" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
    <circle cx="320" cy="292" r="24" fill="#ffc933"/>
    <circle cx="313" cy="285" r="8" fill="#fff4b8" fill-opacity="0.8"/>
  </g>
</svg>
